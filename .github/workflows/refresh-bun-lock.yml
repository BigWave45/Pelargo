name: Refresh Bun lockfile

on:
  push:
    branches: ["design/blue-white-premium"]
    paths:
      - "package.json"
      - "bun.lock"
      - ".github/workflows/refresh-bun-lock.yml"

permissions:
  contents: write

concurrency:
  group: pelargo-preview-lockfile
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/blue-white-premium
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: oven-sh/setup-bun@v2
      - name: Regenerate lockfile from package manifest
        run: bun install --lockfile-only
      - name: Commit lockfile when dependencies changed
        run: |
          set -euo pipefail
          if git diff --quiet -- bun.lock; then
            echo "bun.lock is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock
          git commit -m "chore: refresh Bun lockfile"
          git push origin HEAD:design/blue-white-premium
