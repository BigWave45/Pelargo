name: Refresh Bun lockfile

on:
  push:
    branches:
      - reliability/background-reconciliation
    paths:
      - package.json

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reliability/background-reconciliation
      - uses: oven-sh/setup-bun@v2
      - name: Resolve dependencies and refresh lockfile
        run: bun install
      - name: Commit resolved lockfile and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock
          git rm .github/workflows/refresh-bun-lock.yml
          if git diff --cached --quiet; then
            echo "No lockfile changes were required."
            exit 0
          fi
          git commit -m "chore: lock MetaMask Connect dependency"
          git push origin reliability/background-reconciliation
