name: External merchant acceptance

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: test/external-merchant-integration
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run non-payment merchant API smoke test
        env:
          PELARGO_API_URL: https://test-external-merchant-integ.pelargo.pages.dev
          PELARGO_MERCHANT_API_KEY: ${{ secrets.PELARGO_TEST_MERCHANT_API_KEY }}
          PELARGO_OTHER_MERCHANT_API_KEY: ${{ secrets.PELARGO_OTHER_TEST_MERCHANT_API_KEY }}
          PELARGO_TEST_RECIPIENT: agentg.testnet
        run: |
          if [ -z "$PELARGO_MERCHANT_API_KEY" ]; then
            echo "::error::Add the PELARGO_TEST_MERCHANT_API_KEY repository secret before running this workflow."
            exit 1
          fi
          node scripts/external-merchant-smoke.mjs
