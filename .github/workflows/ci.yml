name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Type-check
        run: bun run lint
      - name: Checkout session security tests
        run: bun run test:security
      - name: Checkout API integration tests
        run: bun run test:api
      - name: External merchant smoke-test syntax
        run: node --check scripts/external-merchant-smoke.mjs
      - name: Build frontend
        run: bun run build
