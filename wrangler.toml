name = "pelargo"
compatibility_date = "2026-11-04"
pages_build_output_dir = "./dist"

# Cloudflare Pages Functions are discovered from ./functions.
# Configure a D1 database binding named DB in Pages settings and apply
# migrations/0001_checkout_storage.sql before using merchant/session APIs.
# Configure MERCHANT_PROVISIONING_SECRET and ORDER_SESSION_SECRET as secrets.
# Add ONECLICK_JWT as a secret only if/when a partner JWT is obtained.
# ALLOW_MAINNET_DEPOSITS must remain unset until an explicitly approved
# real-mainnet payment test is planned.
